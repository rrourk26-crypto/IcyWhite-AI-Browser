<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IcyWhite</title>
<script>(function(){var t="light";try{t=localStorage.getItem("icywhite.theme")||"light"}catch(e){}
var d=t==="dark"||(t==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.setAttribute("data-theme",d?"dark":"light");
document.write('<link id="themeCss" rel="stylesheet" href="css/shell'+(d?'-dark':'-light')+'.css">');})();</script>
<link rel="stylesheet" href="css/passwords.css">
<script src="tab-click.js"></script>
<script src="js/theme.js"></script>
<script src="js/theme-colors.js"></script>
<script src="js/builtin-apps.js"></script>
</head>
<body>
<div id="chrome">
  <div id="tabbar"><div id="tabs"></div><button id="newtab" title="New tab">+</button></div>
  <div id="toolbar">
    <button class="navbtn" id="back" title="Back">‹</button>
    <button class="navbtn" id="forward" title="Forward">›</button>
    <button class="navbtn" id="reload" title="Reload">↻</button>
    <button class="navbtn" id="home" title="Home">⌂</button>
    <form id="urlForm"><input id="address" autocomplete="off" spellcheck="false" placeholder="Search or enter a URL"></form>
    <button class="navbtn" id="pwBtn" title="Passwords (Ctrl+Shift+K)" aria-label="Passwords"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12.5 20 4M16 8l3 3M14 10l2 2"/></svg></button>
    <button class="navbtn" id="favStar" title="Add to favorites">☆</button>
    <div class="dropdownWrap" id="toolsWrap">
      <button class="navbtn" id="toolsBtn" title="Tools">⋮</button>
      <div class="dropdown" id="toolsMenu"></div>
    </div>
  </div>
  <div id="pwBar" role="status"></div>
</div>
<div id="content">
  <div id="findBar">
    <input id="findInput" autocomplete="off" spellcheck="false" placeholder="Find in page">
    <span id="findCount"></span>
    <button id="findPrev" title="Previous">↑</button>
    <button id="findNext" title="Next">↓</button>
    <button id="findClose" title="Close">×</button>
  </div>
  <div id="aiPanel">
    <div id="aiHead"><span>IcyWhite</span><button id="aiClose">×</button></div>
    <div id="aiMessages"><div class="msg ai">I can search, inspect the current page, read visible page text, and use browser actions. Tell me what you want done.</div></div>
    <div id="aiTools">
      <button class="tool" id="aiScreen">See screen</button>
      <button class="tool" id="aiRead">Read page</button>
    </div>
    <div id="status"></div>
    <form id="aiForm"><textarea id="aiInput" placeholder="Ask the AI to search or use this page…"></textarea><button id="aiSend">Go</button></form>
  </div>
</div>
<script>
/* ---------- Window identity (regular vs InPrivate) ---------- */
const urlParams = new URLSearchParams(location.search);
const PARTITION = urlParams.get("partition") || "persist:oasis";
const IS_PRIVATE = urlParams.get("private") === "1";
if (IS_PRIVATE) {
  document.body.classList.add("private");
  document.title = "IcyWhite — InPrivate";
}

const HOME_FILE = "index.html";
const MEDIA_FILE = "tv.html";
const NEW_TAB_URL = "https://www.google.com/";
const DEFAULT_LM_URL = "http://50.5.155.226:1234/v1";
// The Home page (a different storage area) tells the shell which server to use through a shared preference.
let LM_PREF = null;
try { window.oasisElectron.getPref("lm_url").then((v) => { if (v) LM_PREF = v; }); window.oasisElectron.onPref((k, v) => { if (k === "lm_url") LM_PREF = v; }); } catch (e) {}
const tabs=[], views=new Map();
let activeId=null, nextId=1, blankTabNumber=1;

const $=id=>document.getElementById(id);
function fileUrl(file){return new URL(file, location.href).href}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

if (IS_PRIVATE) {
  const badge=document.createElement("span");
  badge.id="privateBadge"; badge.textContent="InPrivate";
  $("toolbar").insertBefore(badge, $("favStar"));
}

function makeTab(url, title, displayUrl="", options={}){
  const id=nextId++;
  const tab=document.createElement("div"); tab.className="tab"; tab.dataset.id=id;
  tab.innerHTML='<span class="favicon">O</span><span class="title"></span><button class="close" title="Close tab">×</button>';
  const initialTitle=title || `Tab ${blankTabNumber++}`;
  tab.querySelector(".title").textContent=initialTitle;
  tab.addEventListener("click",e=>{if(!e.target.closest(".close"))activate(id)});
  tab.querySelector(".close").addEventListener("click",e=>{e.stopPropagation();closeTab(id)});
  tab.addEventListener("contextmenu",e=>openTabContextMenu(e,id));
  wireTabDrag(tab,id);
  $("tabs").appendChild(tab);

  const v=document.createElement("webview");
  v.id="view-"+id; v.src=url;
  v.setAttribute("allowpopups","true");
  v.setAttribute("partition",PARTITION);
  if(options.appTab) v.setAttribute("webpreferences","backgroundThrottling=no");   // the Home/chat page keeps listening and timing normally while another tab is in front
  v.style.display="none";
  $("content").prepend(v);

  const item={id,tab,view:v,title:initialTitle,fixedTitle:Boolean(title),displayUrl:displayUrl||"",fixedUrl:Boolean(displayUrl),appTab:Boolean(options.appTab),groupId:null};
  tabs.push(item); views.set(id,v);

  v.addEventListener("page-title-updated",e=>{
    if(!item.fixedTitle){
      tab.querySelector(".title").textContent=e.title||initialTitle;
      updateHistoryTitle(safeGetURL(v), e.title);
    }
  });
  v.addEventListener("did-navigate",()=>{
    if(follow.on && activeId===id && id!==follow.chatId){ clearTimeout(follow.navTimer); follow.navTimer=setTimeout(()=>onTabActivated(id),600); }   // a page change can swap what is being captured
    if(!item.fixedUrl) item.displayUrl="";
    if(activeId===id)syncAddress(v,item);
    recordHistory(safeGetURL(v), tab.querySelector(".title").textContent);
  });
  v.addEventListener("did-navigate-in-page",()=>{if(activeId===id)syncAddress(v,item)});
  // The Home page asks for tabs through this bridge when the AI opens an app or
  // a search (see openTab in project-preload.js).
  v.addEventListener("ipc-message",e=>{
    if(e.channel==="oasis-tabs"){ handleTabsRequest(item,v,e.args||[]); return; }
    if(e.channel==="oasis-share-stopped"){ if(follow.chatId===id) follow.on=false; return; }
    if(e.channel!=="oasis-open-tab") return;
    const url=String((e.args&&e.args[0])||"");
    if(!isAllowedTabUrl(url)) return;
    const meta=appTabMeta(url);
    makeTab(url,meta.title,meta.displayUrl);
  });
  // Password manager: login forms found in the page, "fill" clicks and submitted logins arrive on "pw-*" channels (js/passwords-ui.js)
  v.addEventListener("ipc-message",e=>{ if(typeof pwHandleGuest==="function"&&String(e.channel).startsWith("pw-")) pwHandleGuest(item,v,e.channel,(e.args||[])[0]); });
  v.addEventListener("did-navigate",()=>{ if(typeof pwOnNavigate==="function") pwOnNavigate(item); });
  v.addEventListener("dom-ready",()=>{
    if(activeId===id)syncAddress(v,item);
    installHomeToolbarHooks(v);
  });
  v.addEventListener("did-fail-load",e=>{
    if(e.errorCode!==-3 && activeId===id) $("address").value=e.validatedURL||e.url||"";
    // A page that can't load now says why, instead of leaving a blank tab.
    if(e.isMainFrame && e.errorCode!==-3 && !/^data:/i.test(e.validatedURL||"")){
      const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
      const dk=document.documentElement.getAttribute("data-theme")==="dark",pc=dk?["#0b101c","#dbe6f7","#ff9a9a","#8fa3bf"]:["#f4f6fa","#0a1322","#5d0808","#44556c"];
      const page='<meta charset="utf-8"><body style="font:15px Segoe UI,sans-serif;background:'+pc[0]+';color:'+pc[1]+';padding:48px;line-height:1.6"><h2>This page could not be opened</h2><p>'+esc(e.validatedURL||e.url)+'</p><p style="color:'+pc[2]+'">'+esc(e.errorDescription||"error")+" ("+esc(e.errorCode)+")</p><p style=\"color:"+pc[3]+"\">If this is one of the built-in apps, the file may be missing from the app folder. Re-extract the zip fully and try again.</p>";
      try{ v.loadURL("data:text/html;charset=utf-8,"+encodeURIComponent(page)); }catch(err){}
    }
  });
  v.addEventListener("found-in-page",e=>{
    if(activeId===id && $("findBar").classList.contains("open")){
      const r=e.result;
      $("findCount").textContent=r.matches ? (r.activeMatchOrdinal+"/"+r.matches) : "0/0";
    }
  });
  activate(id);
  return id;
}
// Only web links, or pages inside this app's own folder, may be opened through the bridge.
function isAllowedTabUrl(url){
  if(/^https?:\/\//i.test(url)) return true;
  if(!/^file:/i.test(url)) return false;
  // Compare as decoded, lower-case, forward-slash paths so spaces, brackets, (1) in the folder name and
  // Windows drive-letter case can't make the app refuse its own pages.
  const dec=t=>{ try{ return decodeURIComponent(t); }catch(e){ try{ return decodeURI(t); }catch(e2){ return t; } } };
  const clean=t=>dec(String(t)).replace(/\\/g,"/").replace(/[?#].*$/,"").toLowerCase();
  try{
    const base=clean(new URL(".",location.href).href);
    const u=clean(url);
    return u.startsWith(base) && !/\/\.\.(\/|$)/.test(u);
  }catch(e){ return false; }
}
function safeGetURL(v){
  // A <webview> only gains its API methods (getURL, loadURL, etc.) once its
  // internal guest view has attached, which happens a tick after the element
  // is created — calling getURL() any earlier throws "v.getURL is not a
  // function" and, if that happens during the very first tab's creation,
  // silently aborts the rest of the startup script (breaking every feature
  // wired up further down, favorites included). Guard every call site.
  if(!v || typeof v.getURL!=="function") return "";
  try{ return v.getURL()||""; }catch(e){ return ""; }
}
function syncAddress(v,item){
  if(item?.displayUrl){ $("address").value=item.displayUrl; }
  else{
    const u=safeGetURL(v);
    $("address").value=(u.endsWith("/index.html") || u.endsWith("/tv.html")) ? "" : u;
  }
  syncStar();
}
function activate(id){
  activeId=id;
  tabs.forEach(t=>{
    const on=t.id===id;
    t.tab.classList.toggle("active",on);
    t.view.classList.toggle("active",on);
    t.view.style.display=on?"flex":"none";
  });
  const item=tabs.find(t=>t.id===id), v=views.get(id);
  if(v) syncAddress(v,item);
  try{ item?.tab.scrollIntoView({inline:"nearest",block:"nearest"}); }catch(e){}
  onTabActivated(id);
}

/* ---- Tab sharing follows you, and the Home page can switch/close tabs for voice commands ---- */
const follow={on:false,chatId:null,requester:null,lastOther:null,navTimer:0};
try{ window.oasisElectron.onShareStarted(info=>{
  const chat=tabs.find(t=>{ try{ return t.view.getWebContentsId()===info.requester; }catch(e){ return false; } });
  follow.on=!!chat && info.kind==="tab"; follow.chatId=chat?chat.id:null; follow.requester=info.requester;
}); }catch(e){}
function onTabActivated(id){
  if(id!==follow.chatId) follow.lastOther=id;
  if(!follow.on || id===follow.chatId) return;
  const chat=tabs.find(t=>t.id===follow.chatId), tv=views.get(id);
  if(!chat || !tv){ if(!chat) follow.on=false; return; }
  let wcId; try{ wcId=tv.getWebContentsId(); }catch(e){ tv.addEventListener("dom-ready",()=>{ if(activeId===id) onTabActivated(id); },{once:true}); return; }
  window.oasisElectron.shareFollowSet({requester:follow.requester,target:wcId}).then(ok=>{ if(ok){ try{ chat.view.send("oasis-share-refollow"); }catch(e){} } }).catch(()=>{});
}
function isHomeView(v){ try{ return safeGetURL(v).split(/[?#]/)[0]===fileUrl("index.html"); }catch(e){ return false; } }
function handleTabsRequest(item,v,args){
  const reqId=args[0], req=args[1]||{};
  const reply=r=>{ try{ v.send("oasis-tabs-result",reqId,r); }catch(e){} };
  if(!isHomeView(v)) return reply({error:"not allowed"});
  if(req.op==="list") return reply({tabs:tabs.map((t,i)=>({id:t.id,index:i+1,title:t.tab.querySelector(".title").textContent||"",url:safeGetURL(t.view),active:t.id===activeId,chat:t.id===item.id})),lastOther:follow.lastOther});
  // Hands-free actions on "the tab you are looking at" (never the chat tab itself).
  if(["new","open","reload","back","forward","scroll","text","closeothers","click","links","closecur"].includes(req.op)){
    if(req.op==="new"){ try{ makeTab(NEW_TAB_URL); return reply({ok:true}); }catch(e){ return reply({error:"failed"}); } }
    if(req.op==="open"){ const u=String(req.url||""); if(!/^https?:\/\//i.test(u)) return reply({error:"bad address"}); try{ makeTab(u); return reply({ok:true}); }catch(e){ return reply({error:"failed"}); } }
    if(req.op==="closeothers"){
      const keep=tabs.find(t=>t.id===activeId && t.id!==item.id) || tabs.find(t=>t.id===follow.lastOther && t.id!==item.id) || null;
      const others=tabs.filter(t=>t.id!==item.id && (!keep || t.id!==keep.id));
      if(req.dry) return reply({ok:true,n:others.length});
      others.forEach(t=>closeTab(t.id));
      return reply({ok:true,n:others.length});
    }
    const cur=tabs.find(t=>t.id===activeId && t.id!==item.id) || tabs.find(t=>t.id===follow.lastOther && t.id!==item.id) || null;
    if(!cur) return reply({error:"no page"});
    const cv=cur.view;
    try{
      if(req.op==="click"||req.op==="links"){
        if(typeof window.OasisTabClick!=="function") return reply({error:"failed"});
        const code="("+window.OasisTabClick.toString()+")("+JSON.stringify(req.op==="links"?"list":"click")+","+JSON.stringify(String(req.q||"").slice(0,200))+","+(Number(req.n)||0)+")";
        cv.executeJavaScript(code).then(r=>reply(req.op==="links"?{ok:true,links:r||[],url:safeGetURL(cv),title:cur.tab.querySelector(".title").textContent||""}:(r||{error:"no answer"})),()=>reply({error:"failed"})); return;
      }
      if(req.op==="closecur"){
        const at=tabs.findIndex(t=>t.id===cur.id); closeTab(cur.id);
        if(follow.on && activeId===item.id){ const rest=tabs.filter(t=>t.id!==item.id); if(rest.length) activate((rest[Math.min(Math.max(0,at-1),rest.length-1)]).id); }
        return reply({ok:true});
      }
      if(req.op==="reload"){ cv.reload(); return reply({ok:true}); }
      if(req.op==="back"){ if(cv.canGoBack()){ cv.goBack(); return reply({ok:true}); } return reply({error:"nowhere"}); }
      if(req.op==="forward"){ if(cv.canGoForward()){ cv.goForward(); return reply({ok:true}); } return reply({error:"nowhere"}); }
      if(req.op==="scroll"){
        const d=({down:"window.scrollBy({top:Math.round(window.innerHeight*0.8),behavior:'smooth'})",up:"window.scrollBy({top:-Math.round(window.innerHeight*0.8),behavior:'smooth'})",top:"window.scrollTo({top:0,behavior:'smooth'})",bottom:"window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'})"})[req.dir];
        if(!d) return reply({error:"unknown"});
        cv.executeJavaScript(d).then(()=>reply({ok:true}),()=>reply({error:"failed"})); return;
      }
      if(req.op==="text"){
        cv.executeJavaScript("(document.body&&document.body.innerText)||''").then(t=>reply({ok:true,title:cur.tab.querySelector(".title").textContent||"",url:safeGetURL(cv),text:String(t||"").replace(/\n{3,}/g,"\n\n").slice(0,12000)}),()=>reply({error:"failed"})); return;
      }
    }catch(e){ return reply({error:"failed"}); }
    return;
  }
  const target=tabs.find(t=>t.id===req.id);
  if(!target) return reply({error:"no such tab"});
  if(req.op==="activate"){ activate(target.id); return reply({ok:true}); }
  if(req.op==="close"){
    if(target.id===item.id) return reply({error:"chat tab"});
    const wasActive=target.id===activeId, at=tabs.findIndex(t=>t.id===target.id);
    closeTab(target.id);
    // While a tab is being shared, land on another page (not back on the chat) so the AI keeps seeing something.
    if(wasActive && follow.on && activeId===item.id){ const rest=tabs.filter(t=>t.id!==item.id); if(rest.length) activate((rest[Math.min(Math.max(0,at-1),rest.length-1)]).id); }
    return reply({ok:true});
  }
  reply({error:"unknown"});
}
function closeTab(id){
  const i=tabs.findIndex(t=>t.id===id); if(i<0)return;
  const t=tabs[i]; t.view.remove(); t.tab.remove(); tabs.splice(i,1); views.delete(id);
  groups = groups.filter(g=>tabs.some(x=>x.groupId===g.id));
  renderTabGroupChips();
  if(!tabs.length) makeTab(NEW_TAB_URL);
  else if(activeId===id) activate(tabs[Math.max(0,i-1)].id);
}
function activeView(){return views.get(activeId)}
function activeItem(){return tabs.find(t=>t.id===activeId)}
function openBrowserTab(url,title="",displayUrl="",options={}){return makeTab(url,title,displayUrl,options)}
function navigate(raw){
  let s=raw.trim(); if(!s)return;
  let url;
  if(/^[a-zA-Z][a-zA-Z\d+\-.]*:/.test(s)) url=s;
  else if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(s)) url="https://"+s;
  else url="https://www.google.com/search?q="+encodeURIComponent(s);
  const item=activeItem();
  if(item) item.displayUrl="";
  activeView()?.loadURL(url);
}
$("urlForm").addEventListener("submit",e=>{e.preventDefault();navigate($("address").value)});
$("back").onclick=()=>activeView()?.canGoBack() && activeView().goBack();
$("forward").onclick=()=>activeView()?.canGoForward() && activeView().goForward();
$("reload").onclick=()=>activeView()?.reload();
$("home").onclick=()=>{const i=activeItem();if(i){i.displayUrl="Home";i.fixedUrl=true;}activeView()?.loadURL(fileUrl(HOME_FILE));};
$("newtab").onclick=()=>makeTab(NEW_TAB_URL);

function addMsg(text,who="ai"){let d=document.createElement("div");d.className="msg "+who;d.textContent=text;$("aiMessages").appendChild(d);$("aiMessages").scrollTop=$("aiMessages").scrollHeight;return d}

/* Turn the Home page's browser-like toolbar items into real browser tabs. */
function appTabMeta(url){
  const u=String(url||"");
  if(/onecompiler\.com/i.test(u)) return {title:"Code Editor",displayUrl:"Code Editor"};
  if(/\/tv\.html(?:$|[?#])/i.test(u)) return {title:"TV",displayUrl:"TV"};
  if(/app\.element\.io/i.test(u)) return {title:"Messenger",displayUrl:""};
  // Locally installed apps (opened via the AI's [[app: id]] tag, e.g. Mystic
  // Realm): let the tab pick up the app's own <title> instead of pinning a
  // fixed label, and instead of falling through to a bare "Tab" for file:// URLs.
  if(/\/apps\/mystic-realm\//i.test(u)) return {title:"",displayUrl:""};
  if(/\/apps\/lobby\//i.test(u)) return {title:"",displayUrl:""};
  if(/\/apps\/maze-madness\//i.test(u)) return {title:"Maze Madness",displayUrl:"Maze Madness"};
  if(/\/apps\/chess\//i.test(u)) return {title:"Chess",displayUrl:"Chess"};
  if(/\/apps\/blaze-reels\//i.test(u)) return {title:"Blaze Reels",displayUrl:"Blaze Reels"};
  if(/youtube\.com|youtu\.be/i.test(u)) return {title:"YouTube",displayUrl:""};
  if(/wikipedia\.org/i.test(u)) return {title:"Wikipedia",displayUrl:""};
  try{return {title:new URL(u).hostname.replace(/^www\./i,"")||"Tab",displayUrl:""};}catch{return {title:"Tab",displayUrl:""};}
}
function installHomeToolbarHooks(v){
  try{
    v.executeJavaScript(`(()=>{
      if(window.__oasisBrowserHooksInstalled)return true;
      window.__oasisBrowserHooksInstalled=true;
      const open=(url)=>{ try{ window.open(url,'_blank'); }catch(e){} };
      const bind=(id,url)=>{ const el=document.getElementById(id); if(!el||el.__oasisBound)return; el.__oasisBound=true; el.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();open(url);},true); };
      bind('openCodeLab','https://onecompiler.com/python');
      bind('openLiveTV',new URL('tv.html',location.href).href);
      bind('openOasisElement','https://app.element.io/#/room/#oasis-lobby:matrix.org');
      document.querySelectorAll('#links a').forEach(a=>{
        if(a.__oasisBound)return; a.__oasisBound=true;
        a.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();open(a.href);},true);
      });
      return true;
    })()`,true);
  }catch(e){}
}

async function pageText(){
  const v=activeView(); if(!v)return "";
  try{return await v.executeJavaScript(`(document.body?.innerText||"").slice(0,30000)`,true)}catch(e){return "Could not read this page: "+e.message}
}
async function screenShot(){
  try{
    const v=activeView();
    return v ? await window.oasisElectron.captureWebView(v.getWebContentsId()) : null;
  }catch{return null}
}
async function takeScreenshot(){
  const dataUrl=await screenShot();
  if(!dataUrl){ addMsg("Screenshot was not available for this page."); return; }
  const a=document.createElement("a"); a.href=dataUrl; a.download="oasis-screenshot-"+Date.now()+".png";
  document.body.appendChild(a); a.click(); a.remove();
}
function translatePage(){
  const v=activeView(); const url=safeGetURL(v); if(!v||!url) return;
  const item=activeItem(); if(item){item.displayUrl="";item.fixedUrl=false;}
  v.loadURL("https://translate.google.com/translate?sl=auto&tl=en&u="+encodeURIComponent(url));
}
async function browserAction(action){
  const v=activeView(); if(!v) return "No active page.";
  const a=action||{};
  try{
    if(a.action==="navigate" && a.url){ v.loadURL(a.url); return "Navigated to "+a.url; }
    if(a.action==="back"){v.goBack();return "Went back."}
    if(a.action==="forward"){v.goForward();return "Went forward."}
    if(a.action==="reload"){v.reload();return "Reloaded the page."}
    if(a.action==="scroll"){
      const amount=Number(a.amount||650);
      await v.executeJavaScript(`window.scrollBy({top:${Math.max(-3000,Math.min(3000,amount))},behavior:"smooth"})`,true);
      return "Scrolled "+amount+" pixels.";
    }
    if(a.action==="click" && a.selector){
      const r=await v.executeJavaScript(`(()=>{const e=document.querySelector(${JSON.stringify(a.selector)});if(!e)return {ok:false,error:"Element not found"};e.click();return {ok:true,text:(e.innerText||e.getAttribute("aria-label")||"clicked").slice(0,200)}})()`,true);
      return r.ok ? "Clicked "+r.text : r.error;
    }
    if(a.action==="type" && a.selector){
      const val=String(a.text??"");
      const r=await v.executeJavaScript(`(()=>{const e=document.querySelector(${JSON.stringify(a.selector)});if(!e)return {ok:false,error:"Input not found"};e.focus();e.value=${JSON.stringify(val)};e.dispatchEvent(new Event("input",{bubbles:true}));e.dispatchEvent(new Event("change",{bubbles:true}));return {ok:true}})()`,true);
      return r.ok ? "Typed into the selected field." : r.error;
    }
    return null;

function relativeTime(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return "just now";
  const m=Math.floor(s/60); if(m<60) return m+"m ago";
  const h=Math.floor(m/60); if(h<24) return h+"h ago";
  const d=Math.floor(h/24); return d+"d ago";
}

  const u=["B","KB","MB","GB"]; let i=0, v=n;

/* ---------- Tab groups ---------- */
let groups=[];
let nextGroupId=1;
let groupDraft=null;
let groupDraftTargetTabId=null;
const GROUP_COLORS=["#e05252","#e0a352","#e0d652","#63c76b","#5aa8e0","#9a6ee0","#e05aa8"];
function groupById(id){return groups.find(g=>g.id===id)}
function tabsInGroup(id){return tabs.filter(t=>t.groupId===id)}
function assignTabToGroup(tabId,groupId){
  const item=tabs.find(t=>t.id===tabId); if(!item) return;
  const last=lastMemberEl(groupId,item);
  if(last) $("tabs").insertBefore(item.tab,last.nextSibling);   // keep a group's tabs side by side
  item.groupId=groupId; pruneGroups(); renderTabGroupChips(); syncTabOrder();
}
function removeTabFromGroup(tabId){
  const item=tabs.find(t=>t.id===tabId); if(!item) return;
  item.groupId=null; item.tab.style.display=""; renderTabGroupChips();
}
function ungroupAll(groupId){
  tabs.forEach(t=>{ if(t.groupId===groupId){ t.groupId=null; t.tab.style.display=""; } });
}
function toggleGroupCollapsed(groupId){
  const g=groupById(groupId); if(!g) return;
  g.collapsed=!g.collapsed; renderTabGroupChips();
  if(menuView==="groups") renderToolsMenu();
}
function renderTabGroupChips(){
  document.querySelectorAll("#tabs .groupChip, #tabs .groupRename").forEach(c=>c.remove());
  tabs.forEach(t=>{ if(!t.groupId) t.tab.style.display=""; });
  tabs.forEach(t=>{ t.tab.classList.remove("grouped"); t.tab.style.removeProperty("--gcolor"); });
  groups.forEach(g=>{
    const members=tabs.filter(t=>t.groupId===g.id);
    if(!members.length) return;
    members.forEach(t=>{
      t.tab.classList.add("grouped");
      t.tab.style.setProperty("--gcolor",g.color);
      t.tab.style.display=g.collapsed?"none":"";
    });
    let firstEl=null;
    for(const child of $("tabs").children){
      if(members.some(m=>m.tab===child)){ firstEl=child; break; }
    }
    if(!firstEl) return;
    const chip=document.createElement("button");
    chip.className="groupChip"; chip.style.background=g.color;
    chip.textContent=(g.collapsed?"▸ ":"▾ ")+g.name;
    chip.title=g.collapsed?"Expand group":"Collapse group";
    chip.addEventListener("click",e=>{e.stopPropagation();toggleGroupCollapsed(g.id);});
    chip.addEventListener("dblclick",e=>{e.stopPropagation();renameGroupInline(g.id);});
    chip.addEventListener("contextmenu",e=>openGroupContextMenu(e,g.id));
    chip.dataset.group=g.id;
    $("tabs").insertBefore(chip,firstEl);
  });
}
function startNewGroupDraft(targetTabId){
  groupDraftTargetTabId=targetTabId;
  groupDraft={name:"Group "+(groups.length+1),color:GROUP_COLORS[groups.length%GROUP_COLORS.length]};
  openToolsPanel("groups");
}

/* ---------- Drag tabs: reorder, group (drop on a tab), pop out (drag off the strip) ---------- */
const DRAG_MIME="application/x-oasis-tab";
let dragTabId=null, dragHandled=false;
function pruneGroups(){ groups=groups.filter(g=>tabs.some(x=>x.groupId===g.id)); }
function syncTabOrder(){
  const order=[...$("tabs").querySelectorAll(".tab")].map(el=>Number(el.dataset.id));
  tabs.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
}
function tabEls(skip){ return [...$("tabs").querySelectorAll(".tab")].filter(el=>el!==skip); }
function lastMemberEl(groupId,skipItem){
  const m=tabEls(skipItem?.tab).filter(el=>tabs.find(t=>t.tab===el)?.groupId===groupId); return m[m.length-1]||null;
}
function itemOfEl(el){ return tabs.find(t=>t.tab===el); }
function neighborTab(el,dir,skipEl){   // next/previous tab element, ignoring chips and the tab being moved
  const list=tabEls(skipEl), i=list.indexOf(el); return i<0?null:(list[i+dir]||null);
}
function clearDropMarks(){ document.querySelectorAll(".dropBefore,.dropAfter,.dropGroup").forEach(x=>x.classList.remove("dropBefore","dropAfter","dropGroup")); }
function dropTarget(e){
  const el=e.target.closest?.(".tab, .groupChip"); if(!el||!$("tabs").contains(el)) return null;
  const r=el.getBoundingClientRect(), x=(e.clientX-r.left)/Math.max(1,r.width);
  if(el.classList.contains("groupChip")) return {el,kind:"chip",zone:x<.4?"before":"group"};
  return {el,kind:"tab",zone:x<.28?"before":x>.72?"after":"group"};
}
function wireTabDrag(tab,id){
  tab.draggable=true;
  tab.addEventListener("dragstart",e=>{
    dragTabId=id; dragHandled=false;
    e.dataTransfer.effectAllowed="move";
    e.dataTransfer.setData(DRAG_MIME,String(id));
    tab.classList.add("dragging");
  });
  tab.addEventListener("dragend",e=>{
    tab.classList.remove("dragging"); clearDropMarks();
    const wasId=dragTabId; dragTabId=null;
    if(!dragHandled) maybeTearOff(wasId,e);
  });
}
function placeDraggedTab(item,t){
  const strip=$("tabs");
  let newGroup=null, ref=null;   // ref = node to insert before (null = end)
  if(!t){ strip.appendChild(item.tab); item.groupId=null; return; }
  const T=t.kind==="tab"?itemOfEl(t.el):null;
  if(t.kind==="chip"){
    const g=groupById(Number(t.el.dataset.group));
    if(t.zone==="before"){ strip.insertBefore(item.tab,t.el); item.groupId=null; return; }
    if(g){ const last=lastMemberEl(g.id,item); strip.insertBefore(item.tab,last?last.nextSibling:null); item.groupId=g.id; g.collapsed=false; }
    return;
  }
  if(!T||T===item) return;
  if(t.zone==="group"){
    if(T.groupId){ newGroup=T.groupId; const g=groupById(newGroup); if(g) g.collapsed=false; }
    else{
      const g={id:nextGroupId++,name:"Group "+(groups.length+1),color:GROUP_COLORS[groups.length%GROUP_COLORS.length],collapsed:false};
      groups.push(g); T.groupId=g.id; newGroup=g.id;
    }
    strip.insertBefore(item.tab,T.tab.nextSibling); item.groupId=newGroup; return;
  }
  if(t.zone==="before"){
    const prev=neighborTab(T.tab,-1,item.tab), pItem=prev&&itemOfEl(prev);
    if(T.groupId && pItem && pItem.groupId===T.groupId){ item.groupId=T.groupId; strip.insertBefore(item.tab,T.tab); return; }   // between two members: joins the group
    // before the first tab of a group: sit left of the group's label, not inside it
    let node=T.tab; if(T.groupId){ const chip=strip.querySelector('.groupChip[data-group="'+T.groupId+'"]'); if(chip) node=chip; }
    strip.insertBefore(item.tab,node); item.groupId=null; return;
  }
  // after
  const next=neighborTab(T.tab,1,item.tab), nItem=next&&itemOfEl(next);
  if(T.groupId && nItem && nItem.groupId===T.groupId){ item.groupId=T.groupId; strip.insertBefore(item.tab,T.tab.nextSibling); return; }
  strip.insertBefore(item.tab,T.tab.nextSibling); item.groupId=null;
}
const tabbarEl=document.getElementById("tabbar");
tabbarEl.addEventListener("dragover",e=>{
  if(dragTabId===null || !e.dataTransfer.types.includes(DRAG_MIME)) return;
  e.preventDefault(); e.dataTransfer.dropEffect="move";
  clearDropMarks();
  const t=dropTarget(e); if(!t) return;
  if(t.kind==="tab" && Number(t.el.dataset.id)===dragTabId) return;
  t.el.classList.add(t.zone==="before"?"dropBefore":t.zone==="after"?"dropAfter":"dropGroup");
});
tabbarEl.addEventListener("dragleave",e=>{ if(!tabbarEl.contains(e.relatedTarget)) clearDropMarks(); });
tabbarEl.addEventListener("drop",e=>{
  if(dragTabId===null || !e.dataTransfer.types.includes(DRAG_MIME)) return;
  e.preventDefault(); dragHandled=true;
  const item=tabs.find(x=>x.id===dragTabId); const t=dropTarget(e);
  clearDropMarks(); item?.tab.classList.remove("dragging");
  if(!item) return;
  placeDraggedTab(item,t);
  pruneGroups(); renderTabGroupChips(); syncTabOrder();
  try{ item.tab.scrollIntoView({inline:"nearest",block:"nearest"}); }catch(err){}
});
// Released well away from the strip (or outside the window): the tab becomes its own window.
function maybeTearOff(id,e){
  const item=tabs.find(t=>t.id===id); if(!item) return;
  if(e.screenX===0 && e.screenY===0) return;   // drag was cancelled with Esc
  const bar=tabbarEl.getBoundingClientRect();
  const nearStrip=e.clientX>=0 && e.clientX<=innerWidth && e.clientY>=-6 && e.clientY<=bar.bottom+40;
  if(nearStrip) return;
  const url=safeGetURL(item.view); if(!url || !window.oasisElectron?.popOutTab) return;
  window.oasisElectron.popOutTab({url,partition:PARTITION,title:item.tab.querySelector(".title").textContent,x:e.screenX,y:e.screenY})
    .then(r=>{ if(r&&r.ok) closeTab(item.id); });
}
$("tabs").addEventListener("wheel",e=>{ if(e.deltaY){ $("tabs").scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});

function renameGroupInline(groupId){
  const g=groupById(groupId); const chip=document.querySelector('#tabs .groupChip[data-group="'+groupId+'"]'); if(!g||!chip) return;
  const inp=document.createElement("input"); inp.className="groupRename"; inp.value=g.name; inp.maxLength=30;
  chip.replaceWith(inp); inp.focus(); inp.select();

  inp.addEventListener("keydown",ev=>{ if(ev.key==="Enter") finish(true); else if(ev.key==="Escape") finish(false); });

}

}

  mainItem(menu,{label:"Translate this page",action:()=>{translatePage();closeDropdowns();}});
  mainItem(menu,{label:"Screenshot",shortcut:"Ctrl+Shift+S",action:()=>{takeScreenshot();closeDropdowns();}});
  mainItem(menu,{label:"Find on page",shortcut:"Ctrl+F",action:()=>{openFindBar();closeDropdowns();}});
  sep(menu);
  mainItem(menu,{label:"Developer tools",action:()=>{toggleDevTools();closeDropdowns();}});
  mainItem(menu,{label:"Settings",arrow:true,action:()=>{menuView="settings";renderToolsMenu();}});
  sep(menu);
  mainItem(menu,{label:"About Oasis",action:()=>{window.oasisElectron?.showAbout?.();closeDropdowns();}});
  mainItem(menu,{label:IS_PRIVATE?"Close InPrivate window":"Close Oasis",action:()=>{window.oasisElectron?.closeWindow?.();}});
}
function openBuiltinApp(app){
  const url=fileUrl(app.path), meta=appTabMeta(url);
  makeTab(url, meta.title||app.label, meta.displayUrl);
  closeDropdowns();
}
function appRow(menu,app){
  const row=listRow(menu,app.label,"");
  const em=document.createElement("span"); em.className="ddEmoji"; em.textContent=app.emoji||"•";
  row.prepend(em);
  row.addEventListener("click",()=>openBuiltinApp(app));
}
function renderBuiltinApps(menu){
  const all=Object.values(window.OASIS_APPS||{});
  if(!all.length) return;
  const head=document.createElement("div"); head.className="ddHead"; head.textContent="Built-in apps"; menu.appendChild(head);
  all.filter(a=>!a.group).forEach(a=>appRow(menu,a));
  const dbgRow=listRow(menu,"Debug Log","Pop-up window");
  const dem=document.createElement("span"); dem.className="ddEmoji"; dem.textContent="🐞"; dbgRow.prepend(dem);
  dbgRow.addEventListener("click",()=>{ try{window.oasisElectron.debugOpen();}catch(e){} closeDropdowns(); });
  const groups=[...new Set(all.filter(a=>a.group).map(a=>a.group))];
  groups.forEach(g=>{
    const h2=document.createElement("div"); h2.className="ddHead"; h2.textContent=g; menu.appendChild(h2);
    all.filter(a=>a.group===g).forEach(a=>appRow(menu,a));
  });
  sep(menu);
}
function renderFavoritesPanel(menu){
  panelHeader(menu,"Favorites");
  renderBuiltinApps(menu);
  const fhead=document.createElement("div"); fhead.className="ddHead"; fhead.textContent="Your favorites"; menu.appendChild(fhead);
  const favs=loadFavorites();
  if(!favs.length){ emptyState(menu,"No favorites yet — click the star next to the address bar to save this page."); return; }
  favs.forEach(f=>{
    const row=listRow(menu,f.title||f.url,f.url);
    row.addEventListener("click",()=>{makeTab(f.url);closeDropdowns();});
    addRemoveButton(row,()=>{saveFavorites(loadFavorites().filter(x=>x.url!==f.url));renderToolsMenu();syncStar();});
  });
}
function renderHistoryPanel(menu){
  panelHeader(menu,"History");
  if(IS_PRIVATE){ emptyState(menu,"IcyWhite doesn't keep history in an InPrivate window."); return; }
  const hist=loadHistory();
  if(!hist.length){ emptyState(menu,"No browsing history yet."); return; }
  hist.slice(0,40).forEach(h=>{
    const row=listRow(menu,h.title,relativeTime(h.time)+" · "+h.url);
    row.addEventListener("click",()=>{makeTab(h.url);closeDropdowns();});
    addRemoveButton(row,()=>{saveHistory(loadHistory().filter(x=>!(x.url===h.url&&x.time===h.time)));renderToolsMenu();});
  });
  sep(menu);
  footerButton(menu,"Clear all history",()=>{saveHistory([]);renderToolsMenu();});
}
function renderDownloadsPanel(menu){
  panelHeader(menu,"Downloads");
  if(!downloads.length){ emptyState(menu,"No downloads yet."); }
  else downloads.forEach(d=>{
    let sub;
    if(d.state==="progressing") sub=fmtBytes(d.receivedBytes)+" of "+fmtBytes(d.totalBytes);
    else if(d.state==="completed") sub="Completed"+(d.totalBytes?" · "+fmtBytes(d.totalBytes):"");
    else sub="Failed or cancelled";
    const row=listRow(menu,d.filename||"Download",sub);
    row.addEventListener("click",()=>{ if(d.state==="completed"&&d.path){window.oasisElectron?.openPath?.(d.path);closeDropdowns();} });
    if(d.state==="completed"&&d.path){
      const btn=document.createElement("button"); btn.className="ddRemove"; btn.textContent="⌕"; btn.title="Show in folder";
      btn.addEventListener("click",e=>{e.stopPropagation();window.oasisElectron?.showItemInFolder?.(d.path);});
      row.appendChild(btn);
    }
  });
  sep(menu);
  footerButton(menu,"Open downloads folder",()=>{window.oasisElectron?.openDownloadsFolder?.();closeDropdowns();});
}
function renderGroupsPanel(menu){
  panelHeader(menu,"Tab groups");
  if(groupDraft){ renderGroupDraftForm(menu); return; }
  if(!groups.length){ emptyState(menu,"No tab groups yet. Group tabs to keep related work together."); }
  else groups.forEach(g=>{
    const count=tabsInGroup(g.id).length;
    const row=listRow(menu,g.name,count+" tab"+(count===1?"":"s")+(g.collapsed?" · collapsed":""));
    const dot=document.createElement("span"); dot.className="ddColorDot"; dot.style.background=g.color;
    row.firstChild.prepend(dot);
    row.addEventListener("click",()=>toggleGroupCollapsed(g.id));
    addRemoveButton(row,()=>{ ungroupAll(g.id); groups=groups.filter(x=>x.id!==g.id); renderTabGroupChips(); renderToolsMenu(); });
  });
  sep(menu);
  footerButton(menu,"+ New group",()=>startNewGroupDraft(activeItem()?.id));
}
function renderGroupDraftForm(menu){
  const wrap=document.createElement("div"); wrap.className="ddGroupForm";
  wrap.innerHTML=`
    <label class="ddLabel">Group name</label>
    <input class="ddInput" id="grpName" value="${escapeHtml(groupDraft.name)}" placeholder="Group name">
    <label class="ddLabel">Color</label>
    <div class="ddColorRow" id="grpColors"></div>
    <div class="ddGroupBtns"><button class="ddFooterBtn" id="grpCancel">Cancel</button><button class="ddFooterBtn ddPrimary" id="grpCreate">Create group</button></div>`;
  menu.appendChild(wrap);
  const colorRow=wrap.querySelector("#grpColors");
  GROUP_COLORS.forEach(c=>{
    const sw=document.createElement("button"); sw.className="ddSwatch"+(c===groupDraft.color?" active":""); sw.style.background=c;
    sw.addEventListener("click",()=>{groupDraft.color=c;renderToolsMenu();});
    colorRow.appendChild(sw);
  });
  wrap.querySelector("#grpName").addEventListener("input",e=>{groupDraft.name=e.target.value;});
  wrap.querySelector("#grpCancel").addEventListener("click",()=>{groupDraft=null;groupDraftTargetTabId=null;renderToolsMenu();});
  wrap.querySelector("#grpCreate").addEventListener("click",()=>{
    const g={id:nextGroupId++,name:groupDraft.name.trim()||"Group",color:groupDraft.color,collapsed:false};
    groups.push(g);
    const targetId=groupDraftTargetTabId ?? activeItem()?.id;
    if(targetId!=null) assignTabToGroup(targetId,g.id);
    groupDraft=null; groupDraftTargetTabId=null;
    renderToolsMenu();
  });
}
function renderClearDataPanel(menu){
  panelHeader(menu,"Delete browsing data");
  const wrap=document.createElement("div"); wrap.className="ddClearForm";
  wrap.innerHTML=`
    <label class="ddCheck"><input type="checkbox" id="clrHistory" checked> Browsing history</label>
    <label class="ddCheck"><input type="checkbox" id="clrCookies" checked> Cookies and site data</label>
    <label class="ddCheck"><input type="checkbox" id="clrCache" checked> Cached images and files</label>
    <div class="ddClearNote">Favorites and tab groups are never deleted by this.</div>
    <button class="ddFooterBtn ddDanger" id="clrGo">Clear now</button>`;
  menu.appendChild(wrap);
  wrap.querySelector("#clrGo").addEventListener("click",async()=>{
    const btn=wrap.querySelector("#clrGo"); btn.disabled=true; btn.textContent="Clearing…";
    if(wrap.querySelector("#clrHistory").checked) saveHistory([]);
    await window.oasisElectron?.clearBrowsingData?.(PARTITION,{
      cookies: wrap.querySelector("#clrCookies").checked,
      cache: wrap.querySelector("#clrCache").checked
    });
    btn.textContent="Cleared";
    setTimeout(()=>closeDropdowns(),700);
  });
}
function renderSettingsPanel(menu){
  panelHeader(menu,"Settings");
  const wrap=document.createElement("div"); wrap.className="ddSettingsForm";
  const lm=LM_PREF||localStorage.getItem("oasis_lm_url")||DEFAULT_LM_URL;
  const model=localStorage.getItem("oasis_ai_model")||"local-model";
  wrap.innerHTML=`
    <label class="ddLabel">AI server URL (LM Studio)</label>
    <input class="ddInput" id="setLmUrl" value="${escapeHtml(lm)}">
    <label class="ddLabel">AI model name</label>
    <input class="ddInput" id="setModel" value="${escapeHtml(model)}">
    <button class="ddFooterBtn ddPrimary" id="setSave">Save</button>
    <button class="ddFooterBtn" id="setDbgOpen" title="Open the debug log in a pop-up window">🐞 Debug log</button>
    <button class="ddFooterBtn" id="setDbgCopy" title="Copy the whole debug log to the clipboard">Copy log</button>`;
  menu.appendChild(wrap);
  wrap.querySelector("#setDbgOpen").addEventListener("click",e=>{ e.stopPropagation(); try{window.oasisElectron.debugOpen();}catch(err){} });
  wrap.querySelector("#setDbgCopy").addEventListener("click",async e=>{
    e.stopPropagation(); const btn=e.currentTarget; let ok=false;
    try{ const r=await window.oasisElectron.debugCopy(); ok=!!(r&&r.ok); }catch(err){}
    btn.textContent=ok?"Copied ✓":"Copy failed"; setTimeout(()=>{btn.textContent="Copy log";},1600);
  });
  wrap.querySelector("#setSave").addEventListener("click",()=>{
    localStorage.setItem("oasis_lm_url",wrap.querySelector("#setLmUrl").value.trim()); LM_PREF=wrap.querySelector("#setLmUrl").value.trim(); try{window.oasisElectron.setPref("lm_url",LM_PREF)}catch(e){}
    localStorage.setItem("oasis_ai_model",wrap.querySelector("#setModel").value.trim());
    const btn=wrap.querySelector("#setSave"); btn.textContent="Saved"; setTimeout(()=>closeDropdowns(),500);
  });
}
function renderToolsMenu(){
  const menu=$("toolsMenu");
  menu.innerHTML="";
  if(menuView==="favorites") renderFavoritesPanel(menu);
  else if(menuView==="history") renderHistoryPanel(menu);
  else if(menuView==="groups") renderGroupsPanel(menu);
  else if(menuView==="downloads") renderDownloadsPanel(menu);
  else if(menuView==="clear") renderClearDataPanel(menu);
  else if(menuView==="settings") renderSettingsPanel(menu);
  else renderMainPanel(menu);
}
function openToolsPanel(view){
  closeDropdowns();
  menuView=view;
  renderToolsMenu();
  $("toolsMenu").classList.add("open");
}
$("toolsBtn").addEventListener("click",e=>{
  e.stopPropagation();
  const wasOpen=$("toolsMenu").classList.contains("open");
  closeDropdowns();
  if(!wasOpen){ menuView="main"; groupDraft=null; renderToolsMenu(); $("toolsMenu").classList.add("open"); }
});
function closeDropdowns(){document.querySelectorAll(".dropdown.open").forEach(d=>d.classList.remove("open"));}
// Capture phase (the "true") is essential here: several menu rows rebuild
// #toolsMenu's contents (menu.innerHTML="") as part of handling their own
// click (switching to the Favorites/History/etc. panel). If this outside-
// click check ran during the normal bubble phase, it would run *after* that
// rebuild, find the original clicked element detached from the DOM, wrongly
// conclude the click landed "outside" the menu, and immediately close it —
// which looked like the row did nothing at all. Running in capture phase
// evaluates this before any handler (and any rebuild) runs.
document.addEventListener("click",e=>{if(!e.target.closest(".dropdownWrap"))closeDropdowns();},true);

/* ---------- Find in page ---------- */
function openFindBar(){
  if(!activeView())return;
  $("findBar").classList.add("open");
  $("findInput").value=""; $("findCount").textContent="";
  $("findInput").focus();
}
function closeFindBar(){
  $("findBar").classList.remove("open");
  try{activeView()?.stopFindInPage("clearSelection")}catch(e){}
}
function doFind(forward=true){
  const v=activeView(); if(!v)return;
  const q=$("findInput").value;
  if(!q){ try{v.stopFindInPage("clearSelection")}catch(e){} $("findCount").textContent=""; return; }
  v.findInPage(q,{forward,findNext:false});
}
$("findInput").addEventListener("input",()=>doFind(true));
$("findInput").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();doFind(!e.shiftKey);}
  if(e.key==="Escape"){e.preventDefault();closeFindBar();}
});
$("findNext").addEventListener("click",()=>doFind(true));
$("findPrev").addEventListener("click",()=>doFind(false));
$("findClose").addEventListener("click",closeFindBar);

window.oasisElectron?.onOpenInTab?.(url=>{
  if(!url) return;
  const meta=appTabMeta(url);
  makeTab(url, meta.title, meta.displayUrl);
});
window.oasisElectron?.onContextNav?.(action=>{
  const v=activeView(); if(!v) return;
  if(action==="back"){ if(v.canGoBack()) v.goBack(); }
  else if(action==="forward"){ if(v.canGoForward()) v.goForward(); }
  else if(action==="reload") v.reload();
});

makeTab(fileUrl(HOME_FILE),"Home","Home",{appTab:true});
window.addEventListener("keydown",e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==="l"){e.preventDefault();$("address").focus();$("address").select();}
  if(mod&&!e.shiftKey&&e.key.toLowerCase()==="t"){e.preventDefault();makeTab(NEW_TAB_URL);}
  if(mod&&!e.shiftKey&&e.key.toLowerCase()==="n"){e.preventDefault();window.oasisElectron?.newWindow?.();}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==="n"){e.preventDefault();window.oasisElectron?.newPrivateWindow?.();}
  if(mod&&e.key.toLowerCase()==="w"){e.preventDefault();if(activeId!=null)closeTab(activeId);}
  if(mod&&e.key.toLowerCase()==="f"){e.preventDefault();openFindBar();}
  if(mod&&!e.shiftKey&&e.key.toLowerCase()==="d"){e.preventDefault();$("favStar").click();}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==="o"){e.preventDefault();openToolsPanel("favorites");}
  if(mod&&!e.shiftKey&&e.key.toLowerCase()==="h"){e.preventDefault();openToolsPanel("history");}
  if(mod&&!e.shiftKey&&e.key.toLowerCase()==="j"){e.preventDefault();openToolsPanel("downloads");}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==="delete"){e.preventDefault();openToolsPanel("clear");}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==="s"){e.preventDefault();takeScreenshot();}
  if(mod&&!e.shiftKey&&e.key.toLowerCase()==="p"){e.preventDefault();activeView()?.print();}
  if(e.key==="Escape"){closeDropdowns();closeTabContextMenu();if($("findBar").classList.contains("open"))closeFindBar();}
});
</script>
